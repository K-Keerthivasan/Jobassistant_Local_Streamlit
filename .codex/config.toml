# Main regular Chrome is controlled by the Resume Studio extension bridge.
# Retired separate-profile browser configuration is backed up in engine/setup-backups.
[mcp_servers.resume-studio]
command = 'E:\Dev-Projects\Automatic-Resume-Generator\.venv-runtime\Scripts\python.exe'
args = ['-m', 'resume_gen.mcp_server']
cwd = 'E:\Dev-Projects\Automatic-Resume-Generator'
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers.resume-studio-chrome-applications]
command = 'C:\Program Files\nodejs\node.exe'
args = ['E:\Dev-Projects\Automatic-Resume-Generator\application-mcp\dist\proxy.js']
cwd = 'E:\Dev-Projects\Automatic-Resume-Generator'
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = true
