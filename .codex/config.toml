[mcp_servers.resume_studio_browser]
command = "npx.cmd"
args = [
    "-y",
    "@playwright/mcp@latest",
    "--browser",
    "chrome",
    "--user-data-dir",
    'F:\Dev-Projects\Automatic-Resume-Generator\.pw-profile',
    "--output-dir",
    'F:\Dev-Projects\Automatic-Resume-Generator\data\job-applications\mcp-output',
]
cwd = 'F:\Dev-Projects\Automatic-Resume-Generator'
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers.resume_studio_browser.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_type]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_click]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_select_option]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_fill_form]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_file_upload]
approval_mode = "approve"

[mcp_servers.resume_studio_browser.tools.browser_evaluate]
approval_mode = "approve"

[mcp_servers.playwright]
command = "npx"
args = [
    "@playwright/mcp@latest",
    "--browser",
    "chrome",
    "--user-data-dir",
    'F:\Dev-Projects\Automatic-Resume-Generator\.pw-profile',
    "--output-dir",
    'F:\Dev-Projects\Automatic-Resume-Generator\data\job-applications\mcp-output',
]
