# Resume Studio API, MCP and Chrome workspace run together in Docker.
# Ollama and n8n are ALREADY installed on the host — we do NOT containerize them.
#   - resume-api -> host Ollama  via  http://host.docker.internal:11434
#   - host n8n   -> resume-api   via  http://localhost:8088  (published port below)
# Bring up with:  docker compose -f docker/docker-compose.yml up -d --build
services:
  # Shares only the API container's network namespace: internal Studio calls
  # remain loopback-only and retain the existing application-engine checks.
  chrome-applications:
    build:
      context: ..
      dockerfile: docker/Dockerfile.applications
    image: resume-studio-chrome:latest
    container_name: resume-chrome-applications
    restart: unless-stopped
    network_mode: service:resume-api
    depends_on:
      resume-api:
        condition: service_started
        restart: true
    environment:
      APP_HERMES_BASE_URL: http://host.docker.internal:8642/v1
      APP_WINDOWS_WORKSPACE: ${RESUME_STUDIO_WINDOWS_ROOT:-E:/Dev-Projects/Automatic-Resume-Generator}
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../application-mcp/config/local.json:/app/application-mcp/config/local.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Publishes a loopback-only gateway without recreating the running API
  # container just to add a port (which would interrupt generation).
  chrome-gateway:
    image: nginx:1.28-alpine
    container_name: resume-chrome-gateway
    restart: unless-stopped
    depends_on:
      - chrome-applications
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./applications-nginx.conf:/etc/nginx/nginx.conf:ro

  resume-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: resume-gen-api:latest
    container_name: resume-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    # Load the project-root .env (this compose file lives in docker/, so Compose's
    # default .env lookup misses it — load it explicitly). Provides HERMES_API_KEY,
    # HERMES_MODEL, OLLAMA_MODEL, APIFY_TOKEN, N8N_WEBHOOK_URL, etc.
    env_file:
      - ../.env
    environment:
      # Container-specific OVERRIDES (take precedence over env_file): these must point
      # at the host, not localhost, so the host's .env values can't leak in wrong.
      OLLAMA_HOST: http://host.docker.internal:11434
      PDF_ENGINE: libreoffice
      # Hermes gateway reached via the host-gateway alias (host .env uses localhost).
      # The gateway must bind 0.0.0.0 (API_SERVER_HOST=0.0.0.0) to be reachable here.
      HERMES_BASE_URL: http://host.docker.internal:8642/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Whole data dir (profile, sources.yaml, scraped intake queue) shared with
      # the host so CLI and API/UI see the same jobs; output for generated files.
      - ../data:/app/data
      - ../output:/app/output

  # MCP bridge used by the Job Application Copilot plugin. It exposes focused
  # Resume Studio tools at http://127.0.0.1:8090/mcp; browser control remains a
  # separate capability and final submission is approval-gated in the app.
  resume-mcp:
    image: resume-gen-api:latest
    container_name: resume-mcp
    restart: unless-stopped
    depends_on:
      - resume-api
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - ../.env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      PDF_ENGINE: libreoffice
      HERMES_BASE_URL: http://host.docker.internal:8642/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
      - ../output:/app/output
    command: ["python", "-m", "resume_gen.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8090"]

  # Optional: expose resume-api to your other devices over Tailscale.
  # Your n8n is already on the host, so it does NOT need this. Uncomment only
  # if you want remote devices to hit the API directly. Add TS_AUTHKEY to .env.
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: ts-resume
  #   hostname: resume-gen
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY}
  #     TS_STATE_DIR: /var/lib/tailscale
  #   volumes:
  #     - ts_state:/var/lib/tailscale
  #   cap_add: [NET_ADMIN, SYS_MODULE]
  #   restart: unless-stopped

