# Only the resume-api runs in Docker.
# Ollama and n8n are ALREADY installed on the host — we do NOT containerize them.
#   - resume-api -> host Ollama  via  http://host.docker.internal:11434
#   - host n8n   -> resume-api   via  http://localhost:8088  (published port below)
# Bring up with:  docker compose -f docker/docker-compose.yml up -d --build
services:
  resume-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: resume-gen-api:latest
    container_name: resume-api
    restart: unless-stopped
    ports:
      - "8088:8088"
    # Load the project-root .env (this compose file lives in docker/, so Compose's
    # default .env lookup misses it — load it explicitly). Provides HERMES_API_KEY,
    # HERMES_MODEL, OLLAMA_MODEL, APIFY_TOKEN, N8N_WEBHOOK_URL, etc.
    env_file:
      - ../.env
    environment:
      # Container-specific OVERRIDES (take precedence over env_file): these must point
      # at the host, not localhost, so the host's .env values can't leak in wrong.
      OLLAMA_HOST: http://host.docker.internal:11434
      PDF_ENGINE: libreoffice
      # Hermes gateway reached via the host-gateway alias (host .env uses localhost).
      # The gateway must bind 0.0.0.0 (API_SERVER_HOST=0.0.0.0) to be reachable here.
      HERMES_BASE_URL: http://host.docker.internal:8642/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Whole data dir (profile, sources.yaml, scraped intake queue) shared with
      # the host so CLI and API/UI see the same jobs; output for generated files.
      - ../data:/app/data
      - ../output:/app/output

  # Optional: expose resume-api to your other devices over Tailscale.
  # Your n8n is already on the host, so it does NOT need this. Uncomment only
  # if you want remote devices to hit the API directly. Add TS_AUTHKEY to .env.
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: ts-resume
  #   hostname: resume-gen
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY}
  #     TS_STATE_DIR: /var/lib/tailscale
  #   volumes:
  #     - ts_state:/var/lib/tailscale
  #   cap_add: [NET_ADMIN, SYS_MODULE]
  #   restart: unless-stopped

