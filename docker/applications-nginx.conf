events {}
http {
  # Re-resolve resume-api through Docker's DNS instead of caching the address
  # found at startup: recreating the API container changes its address, and a
  # cached one made this gateway answer 502 until it was restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8091;
    location / {
      set $workspace http://resume-api:8091;
      proxy_pass $workspace;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8091;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
      client_max_body_size 1m;
    }
  }
}
