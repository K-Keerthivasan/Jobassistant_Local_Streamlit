# =============================================================================
# PERSONAS — role-specific framings of the SAME true history in master_profile.
# Each persona maps a job (by keywords) to: a headline, a factual summary seed
# (lifted from the user's own kk_Base_*.docx), which experience to lead with,
# which skills to foreground, and which links to show. Personas change FRAMING
# only — the truth-guard still validates everything against master_profile.yaml.
#
# Auto-selection: the persona whose keywords best match the target job title +
# description wins. The UI can override with a manual pick. If nothing matches,
# generation falls back to the neutral master_profile summary (no persona).
# =============================================================================

