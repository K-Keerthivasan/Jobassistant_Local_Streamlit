    foreground_skills: "React, Next.js, TypeScript, Node.js, Python APIs, PostgreSQL/MongoDB/SQL Server, WordPress"
    summary_seed: >
      Full-stack web developer who ships front to back: React, Next.js, and TypeScript
      on the frontend, Node.js, Express, and Python APIs on the backend, with PostgreSQL,
      MongoDB, MySQL, and SQL Server underneath. Builds and deploys production client
