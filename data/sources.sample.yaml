# Job sources the scraper pulls from.
# Copy this to  data/sources.yaml  and edit (data/sources.yaml is gitignored).
#
# Find the identifiers:
#   greenhouse -> the token in  boards.greenhouse.io/<token>  (or job-boards.greenhouse.io/<token>)
#   lever      -> the slug in   jobs.lever.co/<slug>
#   workday    -> the full public careers URL, e.g.
#                 https://acme.wd5.myworkdayjobs.com/en-US/AcmeCareers
#   generic    -> any career page URL (best-effort text scrape; fragile)

sources:
  - type: greenhouse
    company: "examplehq"        # boards.greenhouse.io/examplehq

  - type: lever
    company: "example"          # jobs.lever.co/example

  - type: workday
    url: "https://acme.wd5.myworkdayjobs.com/en-US/AcmeCareers"
    limit: 20

  - type: generic
    company: "Some Company"
    url: "https://somecompany.com/careers/job-123"

  # Apify: run a job-scraping actor (Indeed, LinkedIn, etc.) and read its output.
  # Put your token in .env as APIFY_TOKEN=apify_api_...  (never commit it).
  - type: apify
    actor: "misceres/indeed-scraper"   # actor id (the run-sync API is used)
    # token_env: "APIFY_TOKEN"          # env var holding the token (this is the default)
    input:                              # actor-specific input; see the actor's docs
      position: "full stack developer"
      location: "London, ON"
      country: "CA"
      maxItems: 25
    # field_map:                        # override field mapping if the actor differs
    #   title: "positionName"
    #   company: "company"
    #   apply_url: "url"
    #   contact_email: "email"

  # Or read an existing Apify dataset by id (fast, no run):
  # - type: apify
  #   dataset_id: "abc123XYZ"

  # Job Bank (Canada) — scrapes the search results + each posting's description.
  # (Its RSS feed is dead/empty, so we scrape the site instead.)
  - type: jobbank
    search: "software developer"     # the search keyword
    location: "Ontario"              # optional; blank = all of Canada
    limit: 25                        # how many postings to pull (each = 1 detail fetch)
    # detail: true                   # fetch each posting for the full description (default)

  # RSS / Atom feed. Each item becomes a job. Stateless feeds that work
  # (remote-heavy; the canada_only filter trims them):
  - type: rss
    url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"
    # company: "Optional override if the feed doesn't include it"

  # Local collector: jobs you saved from the browser via the Tampermonkey
  # userscript (LinkedIn + CareerBeacon -> Resume_Scraper app on :8765).
  # The resume-api container reaches it on the Docker host gateway by default.
  - type: collector
    # base: "http://host.docker.internal:8765"  # default (Docker). On a host CLI
    #                                             use http://localhost:8765
    statuses: ["saved"]        # collector statuses to pull (saved|applied|interview|...)
    exclude_flagged: true      # skip jobs flagged "useless" in the dashboard
    exclude_applied: true      # skip jobs already marked applied

filters:
  # Keep only postings whose title contains one of these (case-insensitive).
  # Leave empty [] to keep everything.
  title_keywords:
    - "developer"
    - "engineer"
    - "full-stack"
    - "full stack"
    - "software"
    - "backend"
    - "frontend"
    - "web"
  # Set true to keep only jobs that expose a contact/HR email (for the email path).
  require_email: false
  # Keep only Canadian postings. Matches "Canada", province names/codes (ON, BC…),
  # and major metros. The global ATS boards (Greenhouse/Lever/Workday) list jobs
  # worldwide, so turn this on to stay in Canada.
  canada_only: true
  keep_unknown_location: true   # keep blank/"remote" postings; false = strict Canada
  # Optional: restrict to specific places (case-insensitive substring of the job
  # location). Leave empty to allow anywhere that passes canada_only.
  location_keywords: []
    # - "ontario"
    # - "remote"
