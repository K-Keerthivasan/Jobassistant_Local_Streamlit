[project]
name = "automatic-resume-generator"
version = "0.1.0"
description = "Local, truth-only resume / cover-letter / email generator with auto-apply automation."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
